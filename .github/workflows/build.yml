name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test via Docker
        run: docker build -t j1939 .
      - name: Check coverage hasn't regressed
        run: |
          docker run --rm j1939 sh -c "
            cmake -S /src -B /src/build_cov -DENABLE_COVERAGE=ON &&
            cmake --build /src/build_cov --target coverage"

  vcan-tests:
    # ubuntu-latest became Ubuntu 26.04 on 2026-10-19; its azure kernel has no
    # linux-modules-extra-<kernel> package, so vcan can't be installed there.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t j1939 .
      - name: Load the vcan kernel module
        run: |
          # Use vcan as shipped if the kernel has it; install the extra modules only if not.
          if ! sudo modprobe vcan 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe vcan
          fi
          lsmod | grep -q '^vcan' || { echo "::error::vcan module could not be loaded"; exit 1; }
      - name: Run SocketCanStream integration tests against vcan0
        run: docker run --rm --cap-add=NET_ADMIN j1939 cmake --build build --target vcan_tests

name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test coverage comparison
        run: python3 -m unittest discover -s scripts -p 'check_coverage_test.py'
      - name: Build and test via Docker
        run: docker build -t j1939 .
      - name: Measure current coverage
        run: |
          mkdir -p coverage-reports/head
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/input:ro" \
            -v "$GITHUB_WORKSPACE/scripts/collect_coverage.sh:/collect.sh:ro" \
            -v "$GITHUB_WORKSPACE/coverage-reports/head:/reports" \
            j1939 bash /collect.sh 2>&1 | tee coverage-reports/head/run.log
      - name: Measure PR base coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base_dir="$RUNNER_TEMP/coverage-base"
          mkdir -p "$base_dir" coverage-reports/base
          git archive "$BASE_SHA" | tar -x -C "$base_dir"
          docker run --rm \
            -v "$base_dir:/input:ro" \
            -v "$GITHUB_WORKSPACE/scripts/collect_coverage.sh:/collect.sh:ro" \
            -v "$GITHUB_WORKSPACE/coverage-reports/base:/reports" \
            j1939 bash /collect.sh 2>&1 | tee coverage-reports/base/run.log
      - name: Reject coverage regressions
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=(--head coverage-reports/head/summary.json --markdown "$GITHUB_STEP_SUMMARY")
          if [[ "$EVENT_NAME" == pull_request ]]; then
            args+=(--base coverage-reports/base/summary.json)
          fi
          python3 scripts/check_coverage.py "${args[@]}"
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage-reports/
          if-no-files-found: warn

  vcan-tests:
    # ubuntu-latest became Ubuntu 26.04 on 2026-10-19; its azure kernel has no
    # linux-modules-extra-<kernel> package, so vcan can't be installed there.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t j1939 .
      - name: Load the vcan kernel module
        run: |
          # Use vcan as shipped if the kernel has it; install the extra modules only if not.
          if ! sudo modprobe vcan 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe vcan
          fi
          lsmod | grep -q '^vcan' || { echo "::error::vcan module could not be loaded"; exit 1; }
      - name: Run SocketCanStream integration tests against vcan0
        run: docker run --rm --cap-add=NET_ADMIN j1939 cmake --build build --target vcan_tests
